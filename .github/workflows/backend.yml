name: Backend CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false


# ============================================================
# BACKEND TEST
# ============================================================

jobs:

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:

      # --------------------------------------------------------
      # Temporary PostgreSQL for CI
      # --------------------------------------------------------

      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: test_group_rewards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Django tests
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT use BACKEND_ENV here.
      #
      # Tests use the temporary PostgreSQL container above.
      # This prevents CI from accidentally connecting to
      # your production Supabase database.
      # --------------------------------------------------------

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: test_group_rewards
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432

        run: |
          python manage.py test tests --noinput


  # ============================================================
  # BACKEND ENVIRONMENT + DEPLOY
  # ============================================================

  backend-deploy:
    name: Configure & Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - backend-test

    # Deploy only on push to main.
    # PRs only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Update Render environment variables
      #
      # GitHub Secret:
      #
      # BACKEND_ENV
      #
      # Example:
      #
      # SECRET_KEY=your-secret
      # DEBUG=False
      # DATABASE_URL=postgresql://...
      # ALLOWED_HOSTS=your-backend.onrender.com
      # CORS_ALLOWED_ORIGINS=https://your-frontend.pages.dev
      #
      # --------------------------------------------------------

      - name: Update Render environment variables
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

        run: |
          set -euo pipefail

          echo "Updating Render environment variables..."

          while IFS= read -r line || [ -n "$line" ]; do

            # Skip empty lines
            if [ -z "$line" ]; then
              continue
            fi

            # Skip comments
            case "$line" in
              \#*)
                continue
                ;;
            esac

            # Make sure the line contains =
            if [[ "$line" != *=* ]]; then
              echo "Skipping invalid environment variable line."
              continue
            fi

            # Split KEY=VALUE
            KEY="${line%%=*}"
            VALUE="${line#*=}"

            # Remove optional surrounding double quotes
            if [[ "$VALUE" == \"*\" ]]; then
              VALUE="${VALUE#\"}"
              VALUE="${VALUE%\"}"
            fi

            # Remove optional surrounding single quotes
            if [[ "$VALUE" == \'*\' ]]; then
              VALUE="${VALUE#\'}"
              VALUE="${VALUE%\'}"
            fi

            echo "Updating Render variable: $KEY"

            curl \
              --fail \
              --silent \
              --show-error \
              --request PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${KEY}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$(jq -n \
                --arg value "$VALUE" \
                '{value: $value}')"

          done <<< "$BACKEND_ENV"

          echo "Render environment variables updated successfully."


      # --------------------------------------------------------
      # Trigger Render deployment
      # --------------------------------------------------------

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered successfully."