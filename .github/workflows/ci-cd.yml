name: CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# JOBS
#
# Execution flow:
#
# Backend Test ────────┐
#                      │
#                      ▼
#                  Backend Deploy
#                      │
# Frontend Test ───────┤
#                      ▼
#                 Frontend Deploy
#
# Backend and Frontend TESTS run independently/in parallel.
#
# Deployment order:
#
# 1. Backend
# 2. Frontend
#
# Frontend deployment will happen ONLY when:
# - Backend tests passed
# - Backend deployment passed
# - Frontend tests passed
# ============================================================


jobs:

  # ============================================================
  # BACKEND TEST
  # ============================================================

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:

      # --------------------------------------------------------
      # Temporary PostgreSQL for CI
      # --------------------------------------------------------

      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: test_group_rewards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Django tests
      #
      # Production BACKEND_ENV is NOT used here.
      #
      # Tests use the temporary PostgreSQL service above.
      # --------------------------------------------------------

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: test_group_rewards
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432

        run: |
          python manage.py test tests --noinput


  # ============================================================
  # FRONTEND TEST
  # ============================================================

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js & pnpm
      # --------------------------------------------------------

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile


      # --------------------------------------------------------
      # Run Vitest
      # --------------------------------------------------------

      - name: Run Vitest
        working-directory: frontend
        run: |
          pnpm test


  backend-migrate:
    name: Run Production Database Migrations
    runs-on: ubuntu-latest

    needs:
      - backend-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create production environment
        working-directory: backend
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

        run: |
          set -euo pipefail

          if [ -z "$BACKEND_ENV" ]; then
            echo "ERROR: BACKEND_ENV secret is not configured."
            exit 1
          fi

          printf '%s\n' "$BACKEND_ENV" > .env

          echo "Production environment created."

      - name: Run production migrations
        working-directory: backend
        run: |
          set -euo pipefail

          echo "Running production database migrations..."

          python manage.py migrate --noinput
          
          python manage.py seed_data

          echo "Production database migrations completed successfully."


  backend-deploy:
    name: Deploy Backend to Vercel
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - backend-migrate

    # Deploy only on push to main.
    #
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}


  # ============================================================
  # FRONTEND BUILD + DEPLOY
  # ============================================================
  #
  # IMPORTANT:
  #
  # Frontend deployment waits for BOTH:
  #
  # 1. Frontend tests
  # 2. Backend deployment
  #
  # Therefore:
  #
  # Backend tests       ✅
  # Backend deployment  ✅
  # Frontend tests      ✅
  #
  #                       ↓
  #
  #                Frontend Deploy
  #
  # ============================================================

  frontend-deploy:
    name: Build & Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    needs:
      - frontend-test
      - backend-deploy

    # Deploy only on push to main.
    #
    # GitHub automatically skips this job if any required
    # dependency in "needs" fails or is skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}