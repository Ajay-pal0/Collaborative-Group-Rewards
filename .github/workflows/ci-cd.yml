name: CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# JOBS
#
# Execution flow:
#
# Backend Test ────────┐
#                      │
#                      ▼
#                  Backend Deploy
#                      │
# Frontend Test ───────┤
#                      ▼
#                 Frontend Deploy
#
# Backend and Frontend TESTS run independently/in parallel.
#
# Deployment order:
#
# 1. Backend
# 2. Frontend
#
# Frontend deployment will happen ONLY when:
# - Backend tests passed
# - Backend deployment passed
# - Frontend tests passed
# ============================================================


jobs:

  # ============================================================
  # BACKEND TEST
  # ============================================================

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:

      # --------------------------------------------------------
      # Temporary PostgreSQL for CI
      # --------------------------------------------------------

      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: test_group_rewards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Django tests
      #
      # Production BACKEND_ENV is NOT used here.
      #
      # Tests use the temporary PostgreSQL service above.
      # --------------------------------------------------------

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: test_group_rewards
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432

        run: |
          python manage.py test tests --noinput


  # ============================================================
  # FRONTEND TEST
  # ============================================================

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Run Vitest
      # --------------------------------------------------------

      - name: Run Vitest
        working-directory: frontend
        run: |
          npm test


  # ============================================================
  # BACKEND DEPLOY
  # ============================================================
  #
  # Backend deployment starts ONLY after backend tests pass.
  #
  # Frontend tests do NOT block backend deployment.
  #
  # This means:
  #
  # Backend Test   ✅
  # Frontend Test  ❌
  #
  # Backend will STILL deploy.
  #
  # ============================================================

  backend-deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    needs:
      - backend-test

    # Deploy only on push to main.
    #
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Trigger Render deployment
      #
      # Backend production environment variables are configured
      # directly in Render.
      #
      # GitHub only triggers the Render deployment.
      # --------------------------------------------------------

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          echo "Triggering Render backend deployment..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render backend deployment triggered successfully."


  # ============================================================
  # FRONTEND BUILD + DEPLOY
  # ============================================================
  #
  # IMPORTANT:
  #
  # Frontend deployment waits for BOTH:
  #
  # 1. Frontend tests
  # 2. Backend deployment
  #
  # Therefore:
  #
  # Backend tests       ✅
  # Backend deployment  ✅
  # Frontend tests      ✅
  #
  #                       ↓
  #
  #                Frontend Deploy
  #
  # ============================================================

  frontend-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend-test
      - backend-deploy

    # Deploy only on push to main.
    #
    # GitHub automatically skips this job if any required
    # dependency in "needs" fails or is skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Create production environment
      #
      # GitHub Secret:
      #
      # FRONTEND_ENV
      #
      # Example:
      #
      # VITE_API_BASE_URL=https://your-backend.onrender.com
      #
      # IMPORTANT:
      # VITE_* variables are exposed to the browser.
      # Never put backend/private secrets here.
      # --------------------------------------------------------

      - name: Create frontend production environment
        working-directory: frontend
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}

        run: |
          set -euo pipefail

          if [ -z "$FRONTEND_ENV" ]; then
            echo "ERROR: FRONTEND_ENV secret is not configured."
            exit 1
          fi

          printf '%s\n' "$FRONTEND_ENV" > .env.production

          echo "Frontend production environment created."


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


      # --------------------------------------------------------
      # Deploy to Cloudflare Pages
      # --------------------------------------------------------

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name="collaborative-group-rewards" --branch=main