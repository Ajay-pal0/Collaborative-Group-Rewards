name: CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false


jobs:

  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: test_group_rewards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DB_NAME: test_group_rewards
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test backend/tests --noinput


  # ============================================================
  # FRONTEND TESTS
  # ============================================================

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Vitest
        working-directory: frontend
        run: |
          npm test


  # ============================================================
  # FRONTEND BUILD + CLOUDFLARE DEPLOY
  # ============================================================

  frontend-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name="${{ vars.CLOUDFLARE_PROJECT_NAME }}"


  # ============================================================
  # BACKEND DEPLOY
  # ============================================================

  backend-deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"