name: CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# JOB 1 - BACKEND TESTS
# ============================================================

jobs:

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: test_group_rewards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Django tests
      # --------------------------------------------------------

      - name: Run Django tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: test_group_rewards
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432

        run: |
          python manage.py test tests --noinput


  # ============================================================
  # JOB 2 - FRONTEND TESTS
  # ============================================================

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Run Vitest
      # --------------------------------------------------------

      - name: Run Vitest
        working-directory: frontend
        run: |
          npm test


  # ============================================================
  # JOB 3 - FRONTEND BUILD + CLOUDFLARE DEPLOY
  # ============================================================

  frontend-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    # Deploy only when code is pushed to main.
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Create production environment file
      #
      # FRONTEND_ENV should contain:
      #
      # VITE_API_BASE_URL=https://your-backend.onrender.com
      #
      # Do NOT put backend secrets here.
      # VITE_* variables are exposed to the browser.
      # --------------------------------------------------------

      - name: Create frontend production environment
        working-directory: frontend
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s\n' "$FRONTEND_ENV" > .env.production


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


      # --------------------------------------------------------
      # Deploy to Cloudflare Pages
      # --------------------------------------------------------

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name="collaborative-group-rewards" --branch=main


  # ============================================================
  # JOB 4 - BACKEND DEPLOY TO RENDER
  # ============================================================

  backend-deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    # Deploy only when code is pushed to main.
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Trigger Render deployment
      #
      # Backend environment variables such as:
      #
      # SECRET_KEY
      # DATABASE_URL
      # DEBUG
      # ALLOWED_HOSTS
      # CORS_ALLOWED_ORIGINS
      #
      # should be configured directly in Render.
      #
      # BACKEND_ENV is therefore NOT written here.
      # --------------------------------------------------------

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"