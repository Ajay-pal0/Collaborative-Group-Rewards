name: Frontend CI/CD - Collaborative Group Rewards

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deployment
  cancel-in-progress: false


# ============================================================
# FRONTEND TEST
# ============================================================

jobs:

  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Run Vitest
        working-directory: frontend
        run: |
          npm test


  # ============================================================
  # FRONTEND BUILD + DEPLOY
  # ============================================================

  frontend-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - frontend-test

    # Deploy only on push to main.
    # PRs only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Create production environment
      #
      # GitHub Secret:
      #
      # FRONTEND_ENV
      #
      # Example:
      #
      # VITE_API_BASE_URL=https://your-backend.onrender.com
      #
      # IMPORTANT:
      # Never put backend/private secrets here.
      #
      # VITE_* variables are exposed to the browser.
      # --------------------------------------------------------

      - name: Create frontend production environment
        working-directory: frontend
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s\n' "$FRONTEND_ENV" > .env.production


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


      # --------------------------------------------------------
      # Deploy to Cloudflare Pages
      # --------------------------------------------------------

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name="collaborative-group-rewards" --branch=main