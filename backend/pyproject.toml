[project]
name = "collaborative-group-rewards-backend"
version = "0.1.0"
description = "Collaborative Group Rewards Django Backend"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1",
    "djangorestframework==3.18.0",
    "djangorestframework_simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "dj-database-url==3.1.2",
    "python-decouple==3.8",
    "psycopg2-binary==2.9.12",
    "requests>=2.31.0",
    "python-docx==1.2.0",
    "lxml==6.1.1",
    "asgiref==3.12.1",
    "sqlparse==0.6.0",
    "PyJWT==2.13.0",
    "typing_extensions==4.16.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
