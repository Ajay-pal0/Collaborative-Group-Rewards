services:
  db:
    image: postgres:15-alpine
    container_name: together_postgres
    environment:
      POSTGRES_DB: together_db
      POSTGRES_USER: together_user
      POSTGRES_PASSWORD: together_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U together_user -d together_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: together_backend
    command: sh -c "python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-secret-key
      - DEBUG=True
      - DB_NAME=together_db
      - DB_USER=together_user
      - DB_PASSWORD=together_password
      - DB_HOST=db
      - DB_PORT=5432
      - FRONTEND_URL=http://localhost:5173
      - SETU_PAN_VERIFY_URL=${SETU_PAN_VERIFY_URL:-https://dg-sandbox.setu.co/api/verify/pan}
      - SETU_CLIENT_ID=${SETU_CLIENT_ID:-}
      - SETU_CLIENT_SECRET=${SETU_CLIENT_SECRET:-}
      - SETU_PRODUCT_INSTANCE_ID=${SETU_PRODUCT_INSTANCE_ID:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: together_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
